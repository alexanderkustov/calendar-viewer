<!DOCTYPE html>
<html lang="pt-PT" data-app-root="..">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#F9F9F9">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate, max-image-preview:none, max-snippet:0, max-video-preview:0">
<meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate, max-image-preview:none, max-snippet:0, max-video-preview:0">
<title>Entradas e saídas</title>
<link rel="icon" type="image/png" href="../favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&amp;family=Jost:wght@300;400;500&amp;display=swap">
<link rel="stylesheet" href="../style.css">
</head>
<body>

<a class="skip-link" href="#mainContent">Saltar para o conteúdo principal</a>

<main class="main today-main" id="mainContent" tabindex="-1">
  <div class="loading-msg" id="loadingMsg" role="status" aria-live="polite">
    <span class="spinner" aria-hidden="true"></span>
    <span>A carregar movimentos…</span>
  </div>
  <div class="error-banner" id="errorBanner" role="alert" hidden></div>

  <div class="today-days">
    <section class="today-day" aria-labelledby="todayDayTitle">
      <header class="today-day-heading">
        <h2 class="today-day-title" id="todayDayTitle">Hoje</h2>
        <p class="today-date" id="todayDate"></p>
        <p class="today-count" id="todayCount" aria-live="polite"></p>
      </header>
      <ol class="today-list" id="todayList" hidden></ol>
      <p class="empty-state" id="todayEmptyState" hidden>Sem entradas ou saídas hoje.</p>
    </section>

    <section class="today-day" aria-labelledby="tomorrowDayTitle">
      <header class="today-day-heading">
        <h2 class="today-day-title" id="tomorrowDayTitle">Amanhã</h2>
        <p class="today-date" id="tomorrowDate"></p>
        <p class="today-count" id="tomorrowCount" aria-live="polite"></p>
      </header>
      <ol class="today-list" id="tomorrowList" hidden></ol>
      <p class="empty-state" id="tomorrowEmptyState" hidden>Sem entradas ou saídas amanhã.</p>
    </section>
  </div>

  <section class="today-secondary" aria-labelledby="rafaelHeading">
    <header class="today-secondary-header">
      <h2 class="today-secondary-title" id="rafaelHeading">Today - Rafael</h2>
    </header>

    <div class="today-days today-days-secondary">
      <section class="today-day" aria-labelledby="rafaelTodayTitle">
        <header class="today-day-heading">
          <h3 class="today-day-title today-day-title-secondary" id="rafaelTodayTitle">Hoje</h3>
          <p class="today-count" id="rafaelTodayCount" aria-live="polite"></p>
        </header>
        <ol class="today-list today-list-secondary" id="rafaelTodayList" hidden></ol>
        <p class="empty-state empty-state-secondary" id="rafaelTodayEmptyState" hidden>Sem entradas ou saídas hoje.</p>
      </section>

      <section class="today-day" aria-labelledby="rafaelTomorrowTitle">
        <header class="today-day-heading">
          <h3 class="today-day-title today-day-title-secondary" id="rafaelTomorrowTitle">Amanhã</h3>
          <p class="today-count" id="rafaelTomorrowCount" aria-live="polite"></p>
        </header>
        <ol class="today-list today-list-secondary" id="rafaelTomorrowList" hidden></ol>
        <p class="empty-state empty-state-secondary" id="rafaelTomorrowEmptyState" hidden>Sem entradas ou saídas amanhã.</p>
      </section>
    </div>
  </section>
</main>

<script src="../today.js"></script>
</body>
</html>
